server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/translog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: translog
    password: translog123
    driver-class-name: com.mysql.cj.jdbc.Driver
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URL:http://auth-server:9000}
          jwk-set-uri: ${AUTH_SERVER_URL:http://auth-server:9000}/oauth2/jwks

logging:
  level:
    org.springframework.batch: INFO
    cl.translog.batch: INFO

app:
  grid-size: 4
  pool-size: 4
  chunk-size: 50
  total-records: 1000
  output-file-estados-financieros: output/resumen_estados_financieros_anuales.csv
  output-file-intereses: output/resumen_intereses_trimestrales.csv
  output-file-movimientos-financieros: output/resumen_movimientos_financieros_diarios.csv