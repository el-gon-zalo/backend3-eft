name: eft-backend3

services:


  mysql:
    image: mysql:8.0
    container_name: translog-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: translog
      MYSQL_USER: translog
      MYSQL_PASSWORD: translog123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - translog_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - app-network

  backend:
    build:
      context: ./translog-batch
      dockerfile: Dockerfile
    container_name: translog-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      AUTH_SERVER_URL: http://auth-server:9000
    volumes:
      - ./translog-batch/output:/app/output
    depends_on:
      config-server:
        condition: service_healthy
      mysql:
        condition: service_started
      auth-server:
        condition: service_started
    networks:
      - app-network
    

  bff-cajero:
    build:
      context: ./bff-cajero
      dockerfile: Dockerfile
    container_name: bff-cajero
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CORE_STREAMING_BASE_URL: http://backend:8080
      AUTH_SERVER_URL: http://auth-server:9000
    depends_on:
      config-server:
        condition: service_healthy
      backend:
        condition: service_started
      auth-server:
        condition: service_started
    networks:
      - app-network

  bff-mobile:
    build:
      context: ./bff-mobile
      dockerfile: Dockerfile
    container_name: bff-mobile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CORE_STREAMING_BASE_URL: http://backend:8080
      AUTH_SERVER_URL: http://auth-server:9000
    depends_on:
      config-server:
        condition: service_healthy
      backend:
        condition: service_started
      auth-server:
        condition: service_started
    networks:
      - app-network

  bff-web:
    build:
      context: ./bff-web
      dockerfile: Dockerfile
    container_name: bff-web
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CORE_STREAMING_BASE_URL: http://backend:8080
      AUTH_SERVER_URL: http://auth-server:9000
    depends_on:
      config-server:
        condition: service_healthy
      backend:
        condition: service_started
      auth-server:
        condition: service_started
    networks:
      - app-network


  kafka:
    image: apache/kafka:3.9.1
    container_name: week8-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - app-network

  config-server:
    build:
      context: ./config-server
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  discovery-server:
    build:
      context: ./discovery-server
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  auth-server:
    build:
      context: ./auth-server
    container_name: auth-server
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - app-network

  mf-service:
    build:
      context: .
      dockerfile: ./mf-service/Dockerfile
    container_name: mf-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      AUTH_SERVER_URL: http://auth-server:9000
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
      mysql:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  translog_mysql_data: